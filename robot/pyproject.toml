[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosmaster-assist"
version = "0.1.0"
description = "Hilfsroboter-Software für den ROSMASTER X3"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "numpy>=1.24",
    "rplidar-roboticia>=0.9",
]

[project.scripts]
rosmaster-assist = "rosmaster_assist.main:main"

[tool.setuptools.packages.find]
where = ["src"]
